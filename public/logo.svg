<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Sun behind house -->
  <circle cx="105" cy="45" r="28" fill="#f2c4a8" opacity="0.9"/>
  
  <!-- House: open roof (no right side wall top) -->
  <!-- Left roof line -->
  <line x1="8" y1="68" x2="55" y2="22" stroke="#c85a2a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right roof line -->
  <line x1="55" y1="22" x2="102" y2="68" stroke="#c85a2a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left wall -->
  <line x1="8" y1="68" x2="8" y2="108" stroke="#c85a2a" stroke-width="7" stroke-linecap="round"/>
  <!-- Right wall -->
  <line x1="102" y1="68" x2="102" y2="108" stroke="#c85a2a" stroke-width="7" stroke-linecap="round"/>
  <!-- Floor -->
  <line x1="8" y1="108" x2="102" y2="108" stroke="#c85a2a" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Arch door (filled) -->
  <path d="M 38 108 L 38 82 Q 55 62 72 82 L 72 108 Z" fill="#c85a2a"/>
  
  <!-- Plant stem -->
  <line x1="118" y1="108" x2="118" y2="88" stroke="#c85a2a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Plant leaf left -->
  <ellipse cx="112" cy="92" rx="9" ry="5" fill="#c85a2a" transform="rotate(-35 112 92)"/>
  <!-- Plant leaf right -->
  <ellipse cx="124" cy="86" rx="9" ry="5" fill="#c85a2a" transform="rotate(25 124 86)"/>
  <!-- Ground line under plant -->
  <line x1="110" y1="108" x2="130" y2="108" stroke="#c85a2a" stroke-width="3" stroke-linecap="round"/>
</svg>
